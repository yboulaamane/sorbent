[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "winnow"
version = "0.1.0"
description = "A compound triage service: submit a SMILES library, get back a ranked, deduplicated, liability-flagged shortlist."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Yassir" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "rdkit>=2024.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
winnow = "winnow.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["winnow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "chem: tests that exercise the RDKit science layer (need the chem/ stubs implemented)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict_optional = true
warn_unused_ignores = true

# RDKit ships no py.typed marker, and much of it is Boost.Python bindings plus
# modules that build their attributes dynamically at import (Descriptors.MolWt
# and friends exist at runtime but not in the source text). Following it
# produces a stream of false attr-defined errors on functions that demonstrably
# work. Treat the package as untyped, which is what it is.
[[tool.mypy.overrides]]
module = ["rdkit.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
