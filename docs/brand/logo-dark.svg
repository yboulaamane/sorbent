  </g>
  <rect x="25" y="4" width="14" height="56" rx="3" fill="none" stroke="#E6EDF3A0" stroke-width="0.9"/>
  </g>
  <text x="128" y="60" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="37" font-weight="300"
        letter-spacing="1.9" fill="#E6EDF3">Sorbent</text>
  <text x="131" y="82" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="500"
        letter-spacing="3.8" fill="#8B949E">COMPOUND TRIAGE</text>
