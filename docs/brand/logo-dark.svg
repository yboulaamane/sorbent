<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 112" width="440" height="112" role="img" aria-label="Sorbent — compound triage">
  <g transform="translate(18 6) scale(1.56)">
  <defs>
    <clipPath id="lane-dark">
      <rect x="25" y="4" width="14" height="56" rx="3"/>
    </clipPath>
    <linearGradient id="held-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#E0A83C" stop-opacity="0.32"/>
      <stop offset="30%"  stop-color="#E0A83C" stop-opacity="1"/>
      <stop offset="70%"  stop-color="#E0A83C" stop-opacity="1"/>
      <stop offset="100%" stop-color="#E0A83C" stop-opacity="0.32"/>
    </linearGradient>
  </defs>
  <rect x="25" y="4" width="14" height="56" rx="3" fill="#E6EDF3" fill-opacity="0.05"/>
  <g clip-path="url(#lane-dark)">
