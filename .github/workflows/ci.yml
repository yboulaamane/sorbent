name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/winnow
      # Only the API suite gates CI. The chem suite is the implementation
      # spec - it is expected to fail until the stubs are filled in. Move it
      # into this job once it passes.
      - run: pytest -q -m "not chem"
